[build]
  base = "mwe-website"
  command = "npm run build"
  publish = "mwe-website/dist"
  functions = "mwe-website/netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[dev]
  command = "npm run dev:vite"
  port = 8888
  targetPort = 3000
  framework = "#custom"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
